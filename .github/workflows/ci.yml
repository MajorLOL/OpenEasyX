name: Fast checks / publish
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish image tags and create a release
        type: boolean
        default: true
      platforms:
        description: Docker platforms to publish
        required: true
        type: choice
        default: linux/amd64,linux/arm64
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/raccommode/open-easyx

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    steps:
      - name: Select native runners
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
        run: |
          python3 - <<'PY'
          import json, os
          runners = {"linux/amd64": "ubuntu-24.04", "linux/arm64": "ubuntu-24.04-arm"}
          platforms = list(dict.fromkeys(os.environ["PLATFORMS"].split(",")))
          matrix = {"include": [{"platform": p, "arch": p.split("/")[1], "runner": runners[p]} for p in platforms]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps(matrix), file=output)
          PY
      - name: Compute version (YEAR.WEEK.N)
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        run: |
          if [ "$PUBLISH" != true ]; then
            echo "version=ci-test" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREFIX=$(date -u +%G.%V)
          LATEST=$(gh release list --limit 100 --json tagName -q \
            "[.[] | select(.tagName | startswith(\"${PREFIX}.\"))] | length")
          VERSION="${PREFIX}.$((LATEST + 1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install recording test codecs if absent
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: npm run check
        env:
          NODE_OPTIONS: --no-experimental-webstorage
      - run: python -m py_compile worker/subtitles.py

  image:
    name: Image (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build and load the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: open-easyx:ci
          build-args: APP_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Test Docker runtime with an Unraid-style volume
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/docker-runtime-smoke.sh open-easyx:ci "$VERSION"
      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Reuse the builder's exact cached result after the runtime test. Upload by
      # digest only: version/latest tags are gated on all tests and platforms.
      - name: Upload tested image by digest
        if: needs.prepare.outputs.publish == 'true'
        id: upload
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: APP_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Export image digest
        if: needs.prepare.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.upload.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, test, image]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags without rebuilding
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          images=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            hash=$(basename "$digest")
            [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
            images+=("$IMAGE@sha256:$hash")
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
